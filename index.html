<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Home</title>
    <style>
        /* Modern Reset & Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e1e2f 0%, #2d2d44 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        /* Container */
        .hero-container {
            text-align: center;
            padding: 2rem;
            max-width: 600px;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            letter-spacing: -1px;
        }

        p {
            font-size: 1.1rem;
            color: #b0b0cc;
            margin-bottom: 2.5rem;
        }

        /* Button Layout */
        .btn-group {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 0.8rem 2rem;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            border-radius: 50px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        /* Primary Button Style */
        .btn-primary {
            background-color: #6c5ce7;
            color: white;
            border: 2px solid #6c5ce7;
        }

        .btn-primary:hover {
            background-color: #5b4bc4;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(108, 92, 231, 0.3);
        }

        /* Secondary Button Style */
        .btn-secondary {
            background-color: transparent;
            color: white;
            border: 2px solid white;
        }

        .btn-secondary:hover {
            background-color: white;
            color: #1e1e2f;
            transform: translateY(-3px);
        }

        /* Responsive Tweaks */
        @media (max-width: 480px) {
            h1 { font-size: 2.2rem; }
            .btn { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="hero-container">
        <h1>Welcome.</h1>
        <p>This is your new digital home. Clean, professional, and ready for whatever you’re building next.</p>
        
        <div class="btn-group">
            <a href="Thunderstorm_2026/th2026.html" class="btn btn-primary">Primary Action</a>
            <a href="#" class="btn btn-secondary">Learn More</a>
        </div>
    </div>

</body>
</html>
